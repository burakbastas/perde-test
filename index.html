<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seyir · Türk müziği öğrenme oyunu</title>
<meta name="description" content="Türk müziği perdelerini, komaları, dörtlü-beşlileri ve makamları oyunla öğren. Ücretsiz, telefonda çalışır.">
<meta property="og:type" content="website">
<meta property="og:title" content="Seyir · Türk müziği öğrenme oyunu">
<meta property="og:description" content="Perdeler, komalar, dörtlü-beşliler ve makamlar: oyunla, adım adım. Hiç nota bilmeyenler için de.">
<meta property="og:url" content="https://burakbastas.github.io/perde-oyunu/">
<meta property="og:image" content="https://burakbastas.github.io/perde-oyunu/og-kapak.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest?v=2.2.0">
<meta name="theme-color" content="#123a6b">
<link rel="icon" href="icon-192.png?v=2.2.0">
<link rel="apple-touch-icon" href="icon-192.png?v=2.2.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seyir">
<link rel="preload" href="fonts/seyir-nota.woff?v=2.2.0" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/nunito.woff?v=2.2.0" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/baloo2.woff?v=2.2.0" as="font" type="font/woff" crossorigin>
<script>
  // Tema yanıp sönmesin diye en başta uygula
  try { var t = localStorage.getItem('perdeTema'); if (t === 'acik' || t === 'koyu') document.documentElement.setAttribute('data-tema', t); } catch (e) {}
</script>
<link rel="stylesheet" href="css/stil.css?v=2.2.0">
</head>
<body class="yukleniyor">

<div id="hata" hidden><span id="hataMetin"></span><button id="hataKapat" type="button" aria-label="Kapat">✕</button></div>

<!-- ANA EKRAN -->
<section id="ekranAna" class="ekran acik">
  <header id="ust">
    <div class="logo"><span class="logoMaskot" aria-hidden="true"></span><span class="logoMetin"><span class="logoYazi">Seyir</span><span class="logoAlt">Türk müziği öğrenme oyunu</span></span></div>
    <div class="ustHaplar">
      <span class="hap" id="ustSeri" title="Gün serisi">🔥 0</span>
      <span class="hap" id="ustYildiz" title="Yıldız cüzdanı">⭐ 0</span>
    </div>
  </header>
  <main id="sekme"></main>
  <nav id="altMenu">
    <button type="button" data-sekme="yol" class="aktif"><span>🧭</span>Yol</button>
    <button type="button" data-sekme="ogren"><span>📚</span>Öğren</button>
    <button type="button" data-sekme="tekrar"><span>🎯</span>Tekrar</button>
    <button type="button" data-sekme="koleksiyon"><span>🃏</span>Koleksiyon</button>
    <button type="button" data-sekme="profil"><span>👤</span>Profil</button>
  </nav>
</section>

<!-- OYUN -->
<section id="ekranOyun" class="ekran">
  <header class="oyUst">
    <button id="oyCik" type="button" aria-label="Çık">✕</button>
    <div class="ilerleme"><div id="oyDolgu"></div></div>
    <div id="oyKalp"></div>
  </header>
  <div class="sureCubuk"><div id="oySure" hidden></div></div>
  <div id="oyJoker" hidden></div>
  <main id="oyGovde"></main>
  <div class="oyAlt"><button id="oyKontrol" class="dugme" type="button" hidden>Kontrol et</button></div>
  <div id="oyGeri" class="geriBildirim" role="status" aria-live="polite">
    <div id="oyGeriIc"></div>
    <button id="oyDevam" class="dugme" type="button">Devam</button>
  </div>
</section>

<!-- DERS -->
<section id="ekranDers" class="ekran">
  <header class="oyUst">
    <button id="dersCik" type="button" aria-label="Kapat">✕</button>
    <div class="dersBas"><div id="dersBaslik"></div><div id="dersNokta" class="noktalar"></div></div>
  </header>
  <main id="dersGovde"></main>
  <footer class="dersAlt">
    <button id="dersGeri" class="dugme gri" type="button">← Geri</button>
    <button id="dersIleri" class="dugme" type="button">İleri →</button>
  </footer>
</section>

<div id="modal" role="dialog" aria-modal="true"><div id="kutu"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/cekirdek.js?v=2.2.0"></script>
<script src="js/nota.js?v=2.2.0"></script>
<script src="js/perde.js?v=2.2.0"></script>
<script src="js/koma.js?v=2.2.0"></script>
<script src="js/cesni.js?v=2.2.0"></script>
<script src="js/makam.js?v=2.2.0"></script>
<script src="js/gocurme.js?v=2.2.0"></script>
<script src="js/bati.js?v=2.2.0"></script>
<script src="js/ogren.js?v=2.2.0"></script>
<script src="js/motor.js?v=2.2.0"></script>
<script src="js/arayuz.js?v=2.2.0"></script>
<script src="js/rehber.js?v=2.2.0"></script>
<script src="js/baslat.js?v=2.2.0"></script>
<script data-goatcounter="https://perdeoyunu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
